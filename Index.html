<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi rincón de frases y vídeos</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f5f5;
            line-height: 1.6;
        }
        .entrada {
            background: white;
            margin-bottom: 30px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .frase {
            font-size: 1.5em;
            font-style: italic;
            color: #333;
            margin-bottom: 20px;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Ratio 16:9 */
            height: 0;
            overflow: hidden;
            margin-top: 15px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        hr {
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <h1>📖 Frases que inspiran · 🎬 Vídeos que emocionan</h1>
    <p style="text-align:center;">Un espacio sencillo, sin prisas ni algoritmos.</p>
    <hr>

    <!-- EJEMPLO DE ENTRADA 1 -->
    <div class="entrada">
        <div class="frase">
            "La función de la utopía es no hacernos aceptar el presente como el único mundo posible."
        </div>
        <div class="video-container">
            <!-- Ejemplo: pega aquí el código de inserción (embed) de YouTube -->
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="vídeo ejemplo" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <p><small>— Una frase y un vídeo que me hacen pensar.</small></p>
    </div>

    <!-- EJEMPLO DE ENTRADA 2 (puedes copiar y pegar este bloque para más) -->
    <div class="entrada">
        <div class="frase">
            "Escribe tu frase favorita aquí."
        </div>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/OTRO_ID_DE_VIDEO" title="vídeo relacionado" frameborder="0" allowfullscreen></iframe>
        </div>
        <p><small>— Tu comentario o fuente.</small></p>
    </div>

</body>
</html>
