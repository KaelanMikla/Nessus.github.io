<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umbral | Frases y visión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0c10;
            font-family: 'Courier New', 'Monaco', monospace;
            line-height: 1.5;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Tarjeta única (no hay "entradas" múltiples) */
        .card {
            background: #0f1115;
            border: 1px solid #2a2e3a;
            border-radius: 4px;
            padding: 2.5rem;
            box-shadow: 0 20px 35px -15px rgba(0,0,0,0.5);
            transition: border-color 0.2s ease;
        }

        .card:hover {
            border-color: #6b4e3a;
        }

        .frase {
            font-size: 1.8rem;
            font-weight: normal;
            color: #dddcd8;
            text-align: left;
            letter-spacing: -0.3px;
            margin-bottom: 2rem;
            line-height: 1.4;
            border-left: 3px solid #8b5a2b;
            padding-left: 1.5rem;
            font-family: 'Courier New', monospace;
        }

        /* No comillas decorativas, solo contundencia */
        .video-wrapper {
            margin: 2rem 0 1.5rem 0;
            background: #000;
            border: 1px solid #2a2e3a;
        }

        .video-wrapper iframe {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
        }

        .metadata {
            text-align: left;
            font-size: 0.8rem;
            color: #6a6e7a;
            border-top: 1px solid #1e2128;
            padding-top: 1.2rem;
            margin-top: 0.5rem;
            letter-spacing: 0.3px;
        }

        .metadata span {
            color: #9e8b72;
        }

        .footer-note {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.7rem;
            color: #2a2e3a;
            letter-spacing: 1px;
        }

        /* Sin curvas, sin corazones, sin gradientes pastel */
        a {
            color: #9e8b72;
            text-decoration: none;
        }

        @media (max-width: 700px) {
            body {
                padding: 1rem;
            }
            .card {
                padding: 1.5rem;
            }
            .frase {
                font-size: 1.3rem;
                padding-left: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="frase">
            La civilización requiere fuerza para mantenerse.<br>
            ¿No estás dispuesto a usar la fuerza?<br>
            Serás arrollado por bárbaros primitivos que no tienen tales inhibiciones.
        </div>

        <div class="video-wrapper">
    <iframe 
        src="https://www.youtube.com/embed/Q0I-4X25uyw" 
        title="FUI LO QUE ERES Y SERÁS LO QUE SOY" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
    </iframe>
</div>

        <div class="metadata">
            <span>◆</span> perspectiva · sin concesiones
        </div>
    </div>
    <div class="footer-note">
        — silencio · acción · profundidad —
    </div>
</div>
</body>
</html>
